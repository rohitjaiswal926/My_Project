name: Terraform CI-CD Preprod

on:
  pull_request:
    branches:
      - main
    paths:
      - "enviroment/preprod/**"
      - "modules/**"

  push:
    branches:
      - main
    paths:
      - "enviroment/preprod/**"
      - "modules/**"

permissions:
  contents: read

env:
  TF_WORKING_DIR: ./enviroment/preprod
  KEY_VAULT_NAME: my-project-prepod
  KEY_VAULT_SECRET_NAME: vm-admin-password

jobs:

  # ==========================================
  # TERRAFORM PLAN
  # ==========================================
  terraform-plan:

    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      # GitHub Secret TF_VARS → terraform.tfvars
      - name: Create terraform.tfvars
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VARS: ${{ secrets.TF_VARS }}
        run: |
          printf '%s' "$TF_VARS" > terraform.tfvars

      # Azure Login
      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: |
            {
              "clientId": "${{ secrets.CLIENT_ID }}",
              "clientSecret": "${{ secrets.CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.TENANT_ID }}"
            }

      # Get VM password from Key Vault
      - name: Get VM Password from Key Vault
        shell: bash
        run: |
          PASSWORD="$(az keyvault secret show \
            --vault-name "$KEY_VAULT_NAME" \
            --name "$KEY_VAULT_SECRET_NAME" \
            --query value \
            --output tsv)"

          echo "::add-mask::$PASSWORD"
          echo "TF_VAR_vm_admin_password=$PASSWORD" >> "$GITHUB_ENV"

      # Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan


  # ==========================================
  # TERRAFORM APPLY
  # ==========================================
  terraform-apply:

    name: Terraform Apply

    needs:
      - terraform-plan

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    # GitHub Environment approval
    environment:
      name: preprod

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      # GitHub Secret TF_VARS → terraform.tfvars
      - name: Create terraform.tfvars
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VARS: ${{ secrets.TF_VARS }}
        run: |
          printf '%s' "$TF_VARS" > terraform.tfvars

      # Azure Login
      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: |
            {
              "clientId": "${{ secrets.CLIENT_ID }}",
              "clientSecret": "${{ secrets.CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.TENANT_ID }}"
            }

      # Get VM password from Key Vault
      - name: Get VM Password from Key Vault
        shell: bash
        run: |
          PASSWORD="$(az keyvault secret show \
            --vault-name "$KEY_VAULT_NAME" \
            --name "$KEY_VAULT_SECRET_NAME" \
            --query value \
            --output tsv)"

          echo "::add-mask::$PASSWORD"
          echo "TF_VAR_vm_admin_password=$PASSWORD" >> "$GITHUB_ENV"

      # Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve