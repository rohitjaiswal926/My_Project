name: Terraform CD Preprod

on:
workflow_run:
workflows:
- Terraform CI Preprod
types:
- completed
branches:
- main

permissions:
contents: read
actions: read

env:
TF_WORKING_DIR: ./enviroment/preprod
TERRAFORM_VERSION: "1.15.8"

jobs:
terraform-apply:
name: Terraform Apply

```
if: >-
  github.event.workflow_run.conclusion == 'success' &&
  github.event.workflow_run.event == 'push' &&
  github.event.workflow_run.head_branch == 'main'

runs-on: ubuntu-latest

environment:
  name: preprod

concurrency:
  group: terraform-preprod
  cancel-in-progress: false

steps:
  - name: Checkout Same Commit
    uses: actions/checkout@v6
    with:
      ref: ${{ github.event.workflow_run.head_sha }}

  - name: Setup Terraform
    uses: hashicorp/setup-terraform@v3
    with:
      terraform_version: ${{ env.TERRAFORM_VERSION }}

  - name: Prepare Azure Credentials
    id: azure-creds
    shell: bash
    env:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
      TENANT_ID: ${{ secrets.TENANT_ID }}
    run: |
      CREDS="$(jq -n \
        --arg clientId "$CLIENT_ID" \
        --arg clientSecret "$CLIENT_SECRET" \
        --arg subscriptionId "$SUBSCRIPTION_ID" \
        --arg tenantId "$TENANT_ID" \
        '{
          clientId: $clientId,
          clientSecret: $clientSecret,
          subscriptionId: $subscriptionId,
          tenantId: $tenantId
        }')"

      {
        echo 'creds<<EOF'
        echo "$CREDS"
        echo 'EOF'
      } >> "$GITHUB_OUTPUT"

  - name: Azure Login
    uses: azure/login@v3
    with:
      auth-type: SERVICE_PRINCIPAL
      creds: ${{ steps.azure-creds.outputs.creds }}

  - name: Terraform Init
    working-directory: ${{ env.TF_WORKING_DIR }}
    run: terraform init -input=false

  - name: Download CI Terraform Plan
    uses: actions/download-artifact@v4
    with:
      name: terraform-preprod-plan
      path: ${{ env.TF_WORKING_DIR }}
      github-token: ${{ secrets.GITHUB_TOKEN }}
      run-id: ${{ github.event.workflow_run.id }}

  - name: Terraform Apply
    working-directory: ${{ env.TF_WORKING_DIR }}
    run: terraform apply -input=false -auto-approve tfplan