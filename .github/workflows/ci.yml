name: Terraform CI Preprod

on:
push:
branches:
- feature

permissions:
contents: read

env:
TF_WORKING_DIR: ./enviroment/preprod
TERRAFORM_VERSION: "1.14.6"
ARM_CLIENT_ID: ${{ secrets.CLIENT_ID }}
ARM_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
ARM_SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
ARM_TENANT_ID: ${{ secrets.TENANT_ID }}

jobs:
terraform-ci:
name: Security Scan and Terraform Plan
runs-on: ubuntu-latest

steps:
  - name: Checkout Code
    uses: actions/checkout@v6
    with:
      fetch-depth: 0

  # 1. Gitleaks - secret scanning
  - name: Gitleaks Scan
    uses: gitleaks/gitleaks-action@v3
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. TFLint - Terraform linting
  - name: Setup TFLint
    uses: terraform-linters/setup-tflint@v4

  - name: TFLint Scan
    working-directory: ${{ env.TF_WORKING_DIR }}
    run: |
      tflint --init
      tflint

  # 3. Checkov - IaC security scanning
  - name: Checkov Scan
    uses: bridgecrewio/checkov-action@v12
    with:
      directory: ./enviroment/preprod
      framework: terraform

  # 4. Setup Terraform
  - name: Setup Terraform
    uses: hashicorp/setup-terraform@v4
    with:
      terraform_version: ${{ env.TERRAFORM_VERSION }}

  # 5. Create terraform.tfvars from GitHub Secret
  - name: Create Terraform Variables File
    working-directory: ${{ env.TF_WORKING_DIR }}
    env:
      TF_VARS: ${{ secrets.TF_VARS }}
    shell: bash
    run: |
      printf '%s' "$TF_VARS" > terraform.tfvars

  # 6. Azure login
  - name: Azure Login
    uses: azure/login@v3
    with:
      auth-type: SERVICE_PRINCIPAL
      creds: >-
        {"clientId":"${{ secrets.CLIENT_ID }}","clientSecret":"${{ secrets.CLIENT_SECRET }}","subscriptionId":"${{ secrets.SUBSCRIPTION_ID }}","tenantId":"${{ secrets.TENANT_ID }}"}

  # 7. Terraform Init
  - name: Terraform Init
    working-directory: ${{ env.TF_WORKING_DIR }}
    run: terraform init -input=false

  # 8. Terraform Validate
  - name: Terraform Validate
    working-directory: ${{ env.TF_WORKING_DIR }}
    run: terraform validate

  # 9. Terraform Plan
  - name: Terraform Plan
    working-directory: ${{ env.TF_WORKING_DIR }}
    run: terraform plan -input=false -no-color

